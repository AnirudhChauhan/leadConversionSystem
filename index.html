<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Property Advisor</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 380px;
      height: 600px;
      border-radius: 20px;
      backdrop-filter: blur(15px);
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: white;
    }

    .header {
      padding: 15px;
      text-align: center;
      font-weight: 600;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .chat {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      max-width: 75%;
      font-size: 14px;
    }

    .bot {
      background: rgba(255, 255, 255, 0.2);
    }

    .user {
      background: white;
      color: #333;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: none;
      outline: none;
    }

    button {
      margin-left: 10px;
      padding: 10px 15px;
      border: none;
      border-radius: 10px;
      background: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">🏡 AI Property Advisor</div>

    <div class="chat" id="chat"></div>

    <div class="input-area">
      <input type="text" id="input" placeholder="Type here..." />
      <button onclick="sendMessage()">Send</button>
    </div>

  </div>
  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");

    const sessionId = "session_" + Math.random();

    /* ---------- UI ---------- */

    function addBot(text) {
      const div = document.createElement("div");
      div.className = "message bot";
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addUser(text) {
      const div = document.createElement("div");
      div.className = "message user";
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    /* ---------- SEND ---------- */

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addUser(text);
      input.value = "";

      try {
        const res = await fetch("https://leadconversionsystem.onrender.com/lead", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text,
            sessionId
          })
        });

        const data = await res.json();

        if (data?.data?.reply) {
          addBot(data.data.reply);
        } else {
          addBot("Something went wrong, please try again.");
        }

      } catch (err) {
        console.error(err);
        addBot("Server error. Try again.");
      }
    }

    /* ---------- ENTER KEY SUPPORT ---------- */

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault(); // prevent newline
        sendMessage();
      }
    });

    /* ---------- START ---------- */

    addBot("Hi 👋 Looking to buy property?");
  </script>

</body>

</html>
